services:
  - type: web
    name: split-calculator-backend
    env: node
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/splitcalc.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: CORS_ORIGINS
        value: "*"
