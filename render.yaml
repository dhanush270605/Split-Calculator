# Render Blueprint: New > Blueprint > pick this repo. Free web service; database is Neon (external, free).
services:
  - type: web
    name: split-calculator-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL            # paste your Neon connection string in the Render dashboard
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME  # creates the first admin on first boot (only if the DB has no users)
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO                 # optional: "true" seeds demo users/events once into an EMPTY database
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
